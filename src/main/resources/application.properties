spring.application.name=quickpass-backend
server.port=8080
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false
# Origens liberadas no CORS (frontend Angular)
quickpass.cors.origens=http://localhost:4200
# Intervalo do agendador de jobs (expiração de reservas, liberação de caução, radar...)
quickpass.scheduler.intervalo-ms=15000
