spring.application.name=quickpass-backend
server.port=8080
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false
# Origens liberadas no CORS (frontend Angular)
quickpass.cors.origens=http://localhost:4200
# Intervalo do agendador de jobs (expiração de reservas, liberação de caução, radar...)
quickpass.scheduler.intervalo-ms=15000
# Upload de arquivos (multipart): fotos de veículo/vistoria/avaria, documentos do KYC etc.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=80MB
quickpass.uploads.dir=./uploads
quickpass.uploads.max-bytes=10485760
